<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Montserrat:wght@700;900&display=swap');
</style>
<style>
  :root { color-scheme: light dark; supported-color-schemes: light dark; }
  body { margin: 0; padding: 0; background: #ECEFEC; -webkit-text-size-adjust: 100%; }
  .pc-body { background: #ECEFEC; }
  .message-content { font-family: Geist, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #2A2F2C; }
  .message-content div { font-family: inherit; }
  .message-content p { margin: 0 0 16px; }
  .message-content h1, .message-content h2, .message-content h3 { font-family: Montserrat, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #2A2F2C; }
  .message-content h1 { font-size: 28px; line-height: 1.2; font-weight: 900; margin: 0 0 16px; }
  .message-content h2 { font-size: 20px; line-height: 1.3; font-weight: 700; margin: 28px 0 12px; }
  .message-content h3 { font-size: 17px; line-height: 1.4; font-weight: 700; margin: 24px 0 8px; }
  .message-content a { color: #BD4C00; text-decoration: underline; }
  .message-content ul, .message-content ol { margin: 0 0 16px; padding-left: 22px; }
  .message-content li { margin: 0 0 6px; }
  .message-content blockquote { margin: 0 0 16px; padding: 12px 16px; border-left: 3px solid #BD4C00; background: #F5E5DD; border-radius: 0 10px 10px 0; }
  .message-content img { max-width: 100%; height: auto; border-radius: 12px; }
  .message-content hr { border: 0; border-top: 1px solid #E8EDE9; margin: 24px 0; }
  .button, .message-content a.button { display: inline-block; background: #2A2F2C; color: #FFFFFF !important; font-family: Montserrat, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; text-decoration: none; padding: 14px 24px; border-radius: 12px; }
  .button:hover { background: #3D433F; }
  .pc-footer a { color: #555555; text-decoration: underline; }
  .pc-logo-dark { display: none; mso-hide: all; max-height: 0; overflow: hidden; }
  @media (max-width: 620px) {
    .pc-gutter { padding-left: 12px !important; padding-right: 12px !important; }
    .pc-card { padding: 28px 22px !important; }
  }
  @media (prefers-color-scheme: dark) {
    body, .pc-body { background: #111512 !important; }
    .pc-card { background: #202521 !important; }
    .message-content, .message-content h1, .message-content h2, .message-content h3 { color: #F0F0F0 !important; }
    .message-content a { color: #F28552 !important; }
    .message-content blockquote { background: #2A1810 !important; border-left-color: #E4551C !important; }
    .message-content hr { border-top-color: #2A2F2B !important; }
    .button, .message-content a.button { background: #F0F0F0 !important; color: #111512 !important; }
    .pc-footer, .pc-footer a { color: #8C8C8C !important; }
    .pc-logo-light { display: none !important; }
    .pc-logo-dark { display: block !important; max-height: none !important; overflow: visible !important; }
  }
</style>
<div class="pc-body" style="margin: 0; padding: 0; background: #ECEFEC;">
  <!--[if mso]><table role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; margin: 0 auto;">
    <tr>
      <td class="pc-gutter" style="padding: 36px 24px 20px;">
        <a href="https://pocketchomp.com" style="text-decoration: none;">
          <img class="pc-logo-light" src="https://pocketchomp.com/email/wordmark.png" width="160" height="25" alt="PocketChomp" style="display: block; width: 160px; height: auto; border: 0;">
          <div class="pc-logo-dark"><img src="https://pocketchomp.com/email/wordmark-white.png" width="160" height="25" alt="PocketChomp" style="display: block; width: 160px; height: auto; border: 0;"></div>
        </a>
      </td>
    </tr>
    <tr>
      <td class="pc-gutter" style="padding: 0 24px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td class="pc-card" style="background: #FFFFFF; border-radius: 16px; padding: 36px 40px;">
              <div class="message-content" style="font-family: Geist, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #2A2F2C;">
                {{ message_content }}
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td class="pc-footer pc-gutter" align="center" style="padding: 28px 24px 44px; font-family: Geist, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; line-height: 1.7; color: #555555;">
        <img src="https://pocketchomp.com/email/donut.png" width="24" height="24" alt="" style="display: block; margin: 0 auto 12px; border: 0;">
        <a href="https://pocketchomp.com" style="color: #555555;">pocketchomp.com</a> &middot;
        <a href="{{ subscriber_preferences_url }}" style="color: #555555;">Email preferences</a> &middot;
        <a href="{{ unsubscribe_url }}" style="color: #555555;">Unsubscribe</a><br>
        {{ address }}
      </td>
    </tr>
  </table>
  <!--[if mso]></td></tr></table><![endif]-->
</div>
